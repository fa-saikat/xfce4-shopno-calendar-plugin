# picom rules for Shopno Calendar
#
# Shopno Calendar sets its window role to "shopno-calendar-blur" when blur
# is turned on in its properties, and to "shopno-calendar" otherwise.
#
# 1. Turn off the Xfce compositor (Settings > Window Manager Tweaks >
#    Compositor) so it does not run alongside picom.
#
# 2. Choose a blur method at the top level of ~/.config/picom/picom.conf:
#
#      blur-method = "dual_kawase";
#      blur-strength = 5;
#
# 3. Add the rules below for your picom version.
#
# 4. Turn on "Blur the background behind the calendar" in the plugin's
#    properties.


# picom 12 and newer: add these entries to your `rules` list.

rules = (
  # Blur off: the calendar draws its own rounded corners
  { match = "window_role = 'shopno-calendar'"; blur-background = false; shadow = false; corner-radius = 0; },

  # Blur on: picom blurs, rounds, and shadows the calendar
  { match = "window_role = 'shopno-calendar-blur'"; blur-background = true; shadow = true; corner-radius = 8; },
);


# picom 10 and 11 do not support `rules`. Use these options instead,
# merging them with any existing lists of the same name:
#
#   blur-background-exclude = [ "window_role = 'shopno-calendar'" ];
#   shadow-exclude = [ "window_role = 'shopno-calendar'" ];
#   rounded-corners-exclude = [ "window_role = 'shopno-calendar'" ];
#   corner-radius-rules = [ "8:window_role = 'shopno-calendar-blur'" ];
